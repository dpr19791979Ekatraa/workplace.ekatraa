kind = "web"
previewPath = "/"
title = "Digital Workplace"
version = "1.0.0"
id = "artifacts/digital-workplace"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22187

[services.development]
run = "pnpm --filter @workspace/digital-workplace run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/digital-workplace", "run", "build" ]
publicDir = "artifacts/digital-workplace/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22187"
BASE_PATH = "/"
