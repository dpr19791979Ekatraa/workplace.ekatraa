openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Digital Workplace API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: users
    description: User management
  - name: departments
    description: Department management
  - name: projects
    description: Project management
  - name: tasks
    description: Task management
  - name: documents
    description: Document management
  - name: announcements
    description: Company announcements
  - name: attendance
    description: Attendance tracking
  - name: leaves
    description: Leave requests
  - name: analytics
    description: Analytics and reporting
  - name: storage
    description: File storage
  - name: meetings
    description: Group calls and scheduled meetings
  - name: notifications
    description: In-app notifications
  - name: reimbursements
    description: Employee expense reimbursements
  - name: performance
    description: Performance management — goals, KPIs, reviews, appraisals, promotions

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ── Users ─────────────────────────────────────────────────────────────
  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List all users
      parameters:
        - name: department
          in: query
          schema: { type: string }
        - name: role
          in: query
          schema: { type: string }
        - name: search
          in: query
          schema: { type: string }
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserList"
    post:
      operationId: createUser
      tags: [users]
      summary: Create a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /users/me:
    get:
      operationId: getCurrentUser
      tags: [users]
      summary: Get current user profile
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
    patch:
      operationId: updateCurrentUser
      tags: [users]
      summary: Update current user profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /users/{id}:
    get:
      operationId: getUser
      tags: [users]
      summary: Get a user by ID
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: User
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    patch:
      operationId: updateUser
      tags: [users]
      summary: Update a user
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
    delete:
      operationId: deleteUser
      tags: [users]
      summary: Delete a user
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deleted

  # ── Departments ────────────────────────────────────────────────────────
  /departments:
    get:
      operationId: listDepartments
      tags: [departments]
      summary: List all departments
      responses:
        "200":
          description: List of departments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Department"
    post:
      operationId: createDepartment
      tags: [departments]
      summary: Create department
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DepartmentInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Department"

  /departments/{id}:
    patch:
      operationId: updateDepartment
      tags: [departments]
      summary: Update department
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DepartmentInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Department"
    delete:
      operationId: deleteDepartment
      tags: [departments]
      summary: Delete department
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deleted

  # ── Projects ────────────────────────────────────────────────────────────
  /projects:
    get:
      operationId: listProjects
      tags: [projects]
      summary: List projects
      parameters:
        - name: status
          in: query
          schema: { type: string }
        - name: search
          in: query
          schema: { type: string }
      responses:
        "200":
          description: List of projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
    post:
      operationId: createProject
      tags: [projects]
      summary: Create project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"

  /projects/{id}:
    get:
      operationId: getProject
      tags: [projects]
      summary: Get project
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
    patch:
      operationId: updateProject
      tags: [projects]
      summary: Update project
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
    delete:
      operationId: deleteProject
      tags: [projects]
      summary: Delete project
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deleted

  /projects/summary:
    get:
      operationId: getProjectsSummary
      tags: [projects]
      summary: Get projects summary stats
      responses:
        "200":
          description: Summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectsSummary"

  # ── Tasks ────────────────────────────────────────────────────────────────
  /tasks:
    get:
      operationId: listTasks
      tags: [tasks]
      summary: List tasks
      parameters:
        - name: projectId
          in: query
          schema: { type: integer }
        - name: assigneeId
          in: query
          schema: { type: integer }
        - name: status
          in: query
          schema: { type: string }
        - name: priority
          in: query
          schema: { type: string }
      responses:
        "200":
          description: List of tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"
    post:
      operationId: createTask
      tags: [tasks]
      summary: Create task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"

  /tasks/{id}:
    get:
      operationId: getTask
      tags: [tasks]
      summary: Get task
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
    patch:
      operationId: updateTask
      tags: [tasks]
      summary: Update task
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
    delete:
      operationId: deleteTask
      tags: [tasks]
      summary: Delete task
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deleted

  # ── Documents ─────────────────────────────────────────────────────────────
  /documents:
    get:
      operationId: listDocuments
      tags: [documents]
      summary: List documents
      parameters:
        - name: folderId
          in: query
          schema: { type: ["integer", "null"] }
        - name: search
          in: query
          schema: { type: string }
        - name: starred
          in: query
          schema: { type: boolean }
        - name: departmentId
          in: query
          schema: { type: integer }
      responses:
        "200":
          description: List of documents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Document"
    post:
      operationId: createDocument
      tags: [documents]
      summary: Create/upload document
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"

  /documents/{id}:
    get:
      operationId: getDocument
      tags: [documents]
      summary: Get document
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
    patch:
      operationId: updateDocument
      tags: [documents]
      summary: Update document
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
    delete:
      operationId: deleteDocument
      tags: [documents]
      summary: Delete document
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deleted

  /documents/{id}/star:
    patch:
      operationId: toggleDocumentStar
      tags: [documents]
      summary: Toggle document star
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"

  /documents/recent:
    get:
      operationId: getRecentDocuments
      tags: [documents]
      summary: Get recently accessed documents
      responses:
        "200":
          description: Recent documents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Document"

  # ── Announcements ─────────────────────────────────────────────────────────
  /announcements:
    get:
      operationId: listAnnouncements
      tags: [announcements]
      summary: List announcements
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 10 }
      responses:
        "200":
          description: Announcements
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Announcement"
    post:
      operationId: createAnnouncement
      tags: [announcements]
      summary: Create announcement
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnnouncementInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Announcement"

  /announcements/{id}:
    patch:
      operationId: updateAnnouncement
      tags: [announcements]
      summary: Update announcement
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnnouncementInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Announcement"
    delete:
      operationId: deleteAnnouncement
      tags: [announcements]
      summary: Delete announcement
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deleted

  # ── Attendance ────────────────────────────────────────────────────────────
  /attendance:
    get:
      operationId: listAttendance
      tags: [attendance]
      summary: List attendance records
      parameters:
        - name: userId
          in: query
          schema: { type: integer }
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
      responses:
        "200":
          description: Attendance records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Attendance"

  /attendance/clock-in:
    post:
      operationId: clockIn
      tags: [attendance]
      summary: Clock in
      responses:
        "201":
          description: Clocked in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Attendance"

  /attendance/clock-out:
    post:
      operationId: clockOut
      tags: [attendance]
      summary: Clock out
      responses:
        "200":
          description: Clocked out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Attendance"

  /attendance/summary:
    get:
      operationId: getAttendanceSummary
      tags: [attendance]
      summary: Get attendance summary stats
      parameters:
        - name: month
          in: query
          schema: { type: integer }
        - name: year
          in: query
          schema: { type: integer }
      responses:
        "200":
          description: Summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceSummary"

  # ── Leaves ─────────────────────────────────────────────────────────────────
  /leaves:
    get:
      operationId: listLeaves
      tags: [leaves]
      summary: List leave requests
      parameters:
        - name: userId
          in: query
          schema: { type: integer }
        - name: status
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Leave requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Leave"
    post:
      operationId: createLeave
      tags: [leaves]
      summary: Submit leave request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeaveInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Leave"

  /leaves/{id}/status:
    patch:
      operationId: updateLeaveStatus
      tags: [leaves]
      summary: Approve or reject leave
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeaveStatusUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Leave"

  # ── Reimbursements ─────────────────────────────────────────────────────────
  /reimbursements:
    get:
      operationId: listReimbursements
      tags: [reimbursements]
      summary: List reimbursement requests
      parameters:
        - name: userId
          in: query
          schema: { type: integer }
        - name: status
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Reimbursement requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Reimbursement"
    post:
      operationId: createReimbursement
      tags: [reimbursements]
      summary: Submit reimbursement request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReimbursementInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reimbursement"

  /reimbursements/{id}/status:
    patch:
      operationId: updateReimbursementStatus
      tags: [reimbursements]
      summary: Approve, reject, mark paid, or cancel a reimbursement
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReimbursementStatusUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reimbursement"

  /reimbursements/summary:
    get:
      operationId: getReimbursementSummary
      tags: [reimbursements]
      summary: Get current user's reimbursement totals
      responses:
        "200":
          description: Summary
          content:
            application/json:
              schema:
                type: object
                required: [pendingCount, pendingAmount, approvedAmount, paidAmount, currency]
                properties:
                  pendingCount: { type: integer }
                  pendingAmount: { type: number }
                  approvedAmount: { type: number }
                  paidAmount: { type: number }
                  currency: { type: string }

  # ── Performance ────────────────────────────────────────────────────────
  /performance/goals:
    get:
      operationId: listGoals
      tags: [performance]
      summary: List goals
      parameters:
        - { name: userId, in: query, schema: { type: integer } }
        - { name: status, in: query, schema: { type: string } }
      responses:
        "200":
          description: Goals
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Goal" } }
    post:
      operationId: createGoal
      tags: [performance]
      summary: Create a goal
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GoalInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Goal" }

  /performance/goals/{id}:
    patch:
      operationId: updateGoal
      tags: [performance]
      summary: Update goal progress or status
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GoalUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Goal" }
    delete:
      operationId: deleteGoal
      tags: [performance]
      summary: Delete a goal
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "204": { description: Deleted }

  /performance/kpis:
    get:
      operationId: listKpis
      tags: [performance]
      summary: List KPIs
      parameters:
        - { name: userId, in: query, schema: { type: integer } }
      responses:
        "200":
          description: KPIs
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Kpi" } }
    post:
      operationId: createKpi
      tags: [performance]
      summary: Create a KPI
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KpiInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Kpi" }

  /performance/kpis/{id}:
    patch:
      operationId: updateKpi
      tags: [performance]
      summary: Update KPI current value
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KpiUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Kpi" }
    delete:
      operationId: deleteKpi
      tags: [performance]
      summary: Delete KPI
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "204": { description: Deleted }

  /performance/reviews:
    get:
      operationId: listPerfReviews
      tags: [performance]
      summary: List performance reviews (incl. 360 feedback)
      parameters:
        - { name: revieweeId, in: query, schema: { type: integer } }
        - { name: reviewerId, in: query, schema: { type: integer } }
        - { name: cycle, in: query, schema: { type: string } }
        - { name: type, in: query, schema: { type: string } }
      responses:
        "200":
          description: Reviews
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/PerfReview" } }
    post:
      operationId: createPerfReview
      tags: [performance]
      summary: Submit performance review or 360 feedback
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PerfReviewInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PerfReview" }

  /performance/appraisals:
    get:
      operationId: listAppraisals
      tags: [performance]
      summary: List appraisals
      parameters:
        - { name: userId, in: query, schema: { type: integer } }
        - { name: cycle, in: query, schema: { type: string } }
      responses:
        "200":
          description: Appraisals
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Appraisal" } }
    post:
      operationId: createAppraisal
      tags: [performance]
      summary: Propose an appraisal (HR/admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AppraisalInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Appraisal" }

  /performance/appraisals/{id}/status:
    patch:
      operationId: updateAppraisalStatus
      tags: [performance]
      summary: Approve/reject an appraisal
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AppraisalStatusUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Appraisal" }

  /performance/promotions:
    get:
      operationId: listPromotions
      tags: [performance]
      summary: List promotions
      parameters:
        - { name: userId, in: query, schema: { type: integer } }
      responses:
        "200":
          description: Promotions
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Promotion" } }
    post:
      operationId: createPromotion
      tags: [performance]
      summary: Propose a promotion
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PromotionInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Promotion" }

  /performance/promotions/{id}/status:
    patch:
      operationId: updatePromotionStatus
      tags: [performance]
      summary: Approve/reject promotion
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PromotionStatusUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Promotion" }

  /performance/analytics:
    get:
      operationId: getPerformanceAnalytics
      tags: [performance]
      summary: Get organization-wide performance metrics
      responses:
        "200":
          description: Analytics
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PerformanceAnalytics" }

  # ── Analytics ──────────────────────────────────────────────────────────────
  /analytics/dashboard:
    get:
      operationId: getDashboardAnalytics
      tags: [analytics]
      summary: Get main dashboard analytics
      responses:
        "200":
          description: Dashboard stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardAnalytics"

  /analytics/activity:
    get:
      operationId: getActivityFeed
      tags: [analytics]
      summary: Get recent activity feed
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
      responses:
        "200":
          description: Activity feed
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityItem"

  /analytics/productivity:
    get:
      operationId: getProductivityAnalytics
      tags: [analytics]
      summary: Get productivity analytics
      parameters:
        - name: period
          in: query
          schema: { type: string, enum: [week, month, quarter] }
      responses:
        "200":
          description: Productivity data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductivityAnalytics"

  # ── Storage ────────────────────────────────────────────────────────────────
  /storage/uploads/request-url:
    post:
      tags: [storage]
      operationId: requestUploadUrl
      summary: Request a presigned URL for file upload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadUrlRequest"
      responses:
        "200":
          description: Presigned upload URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUrlResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /storage/public-objects/{filePath}:
    get:
      tags: [storage]
      operationId: getPublicObject
      summary: Serve a public asset
      parameters:
        - name: filePath
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Object content
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /storage/objects/{objectPath}:
    get:
      tags: [storage]
      operationId: getStorageObject
      summary: Serve a stored object
      parameters:
        - name: objectPath
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Object content
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  # ── Meetings ─────────────────────────────────────────────────────────────
  /meetings:
    get:
      operationId: listMeetings
      tags: [meetings]
      summary: List meetings
      parameters:
        - name: scope
          in: query
          schema: { type: string, enum: [upcoming, past, all] }
      responses:
        "200":
          description: List of meetings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Meeting"
    post:
      operationId: createMeeting
      tags: [meetings]
      summary: Create a meeting
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MeetingInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Meeting"

  /meetings/{id}:
    delete:
      operationId: deleteMeeting
      tags: [meetings]
      summary: Delete a meeting
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deleted

  # ── Notifications ────────────────────────────────────────────────────────
  /notifications:
    get:
      operationId: listNotifications
      tags: [notifications]
      summary: List notifications for the current user
      parameters:
        - name: unreadOnly
          in: query
          schema: { type: boolean }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 30 }
      responses:
        "200":
          description: List of notifications
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationList"

  /notifications/read-all:
    post:
      operationId: markAllNotificationsRead
      tags: [notifications]
      summary: Mark all notifications as read
      responses:
        "204":
          description: Marked

  /notifications/{id}/read:
    post:
      operationId: markNotificationRead
      tags: [notifications]
      summary: Mark a notification as read
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Marked

  # ── Chat ─────────────────────────────────────────────────────────────────
  /conversations:
    get:
      operationId: listConversations
      tags: [chat]
      summary: List current user's conversations
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Conversation"

  /conversations/direct:
    post:
      operationId: openDirectConversation
      tags: [chat]
      summary: Find or create a 1-on-1 conversation with another user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DirectConversationInput"
      responses:
        "200":
          description: Conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"

  /conversations/group:
    post:
      operationId: createGroupConversation
      tags: [chat]
      summary: Create a group conversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupConversationInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"

  /conversations/{id}/messages:
    get:
      operationId: listMessages
      tags: [chat]
      summary: List messages in a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChatMessage"
    post:
      operationId: sendMessage
      tags: [chat]
      summary: Send a message
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatMessageInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatMessage"

  /conversations/{id}/read:
    post:
      operationId: markConversationRead
      tags: [chat]
      summary: Mark conversation as read up to now
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Marked

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string

    # ── Users ─────────────────────────────────────────────────────────────
    User:
      type: object
      required: [id, clerkId, email, firstName, lastName, role, status, createdAt]
      properties:
        id:
          type: integer
        clerkId:
          type: string
        email:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        role:
          type: string
          enum: [super_admin, admin, hr_manager, team_leader, employee, guest]
        departmentId:
          type: ["integer", "null"]
        departmentName:
          type: ["string", "null"]
        jobTitle:
          type: ["string", "null"]
        avatarUrl:
          type: ["string", "null"]
        phone:
          type: ["string", "null"]
        linkedinUrl:
          type: ["string", "null"]
        bio:
          type: ["string", "null"]
        birthday:
          type: ["string", "null"]
          format: date
        workAnniversary:
          type: ["string", "null"]
          format: date
        status:
          type: string
          enum: [active, inactive, blocked]
        createdAt:
          type: string
          format: date-time
        lastLoginAt:
          type: ["string", "null"]
          format: date-time

    UserList:
      type: object
      required: [users, total, page, limit]
      properties:
        users:
          type: array
          items:
            $ref: "#/components/schemas/User"
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer

    UserInput:
      type: object
      required: [email, firstName, lastName, role]
      properties:
        email:
          type: string
          format: email
        password:
          type: ["string", "null"]
          minLength: 8
          description: "If provided, a Clerk account is created so the employee can sign in with email + this password."
        firstName:
          type: string
        lastName:
          type: string
        role:
          type: string
          enum: [super_admin, admin, hr_manager, team_leader, employee, guest]
        departmentId:
          type: ["integer", "null"]
        jobTitle:
          type: ["string", "null"]
        phone:
          type: ["string", "null"]
        avatarUrl:
          type: ["string", "null"]
        linkedinUrl:
          type: ["string", "null"]
        bio:
          type: ["string", "null"]
        birthday:
          type: ["string", "null"]
          format: date
        workAnniversary:
          type: ["string", "null"]
          format: date

    UserUpdate:
      type: object
      properties:
        firstName:
          type: string
        lastName:
          type: string
        role:
          type: string
          enum: [super_admin, admin, hr_manager, team_leader, employee, guest]
        departmentId:
          type: ["integer", "null"]
        jobTitle:
          type: ["string", "null"]
        phone:
          type: ["string", "null"]
        avatarUrl:
          type: ["string", "null"]
        linkedinUrl:
          type: ["string", "null"]
        bio:
          type: ["string", "null"]
        birthday:
          type: ["string", "null"]
          format: date
        workAnniversary:
          type: ["string", "null"]
          format: date
        status:
          type: string
          enum: [active, inactive, blocked]

    # ── Departments ────────────────────────────────────────────────────────
    Department:
      type: object
      required: [id, name, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: ["string", "null"]
        managerId:
          type: ["integer", "null"]
        managerName:
          type: ["string", "null"]
        memberCount:
          type: integer
        createdAt:
          type: string
          format: date-time

    DepartmentInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
        description:
          type: ["string", "null"]
        managerId:
          type: ["integer", "null"]

    # ── Projects ────────────────────────────────────────────────────────────
    Project:
      type: object
      required: [id, name, status, priority, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: ["string", "null"]
        status:
          type: string
          enum: [planning, active, on_hold, completed, cancelled]
        priority:
          type: string
          enum: [low, medium, high, critical]
        ownerId:
          type: ["integer", "null"]
        ownerName:
          type: ["string", "null"]
        departmentId:
          type: ["integer", "null"]
        departmentName:
          type: ["string", "null"]
        startDate:
          type: ["string", "null"]
          format: date
        dueDate:
          type: ["string", "null"]
          format: date
        progress:
          type: integer
          minimum: 0
          maximum: 100
        taskCount:
          type: integer
        completedTaskCount:
          type: integer
        memberCount:
          type: integer
        createdAt:
          type: string
          format: date-time

    ProjectInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
        description:
          type: ["string", "null"]
        status:
          type: string
          enum: [planning, active, on_hold, completed, cancelled]
        priority:
          type: string
          enum: [low, medium, high, critical]
        departmentId:
          type: ["integer", "null"]
        startDate:
          type: ["string", "null"]
          format: date
        dueDate:
          type: ["string", "null"]
          format: date

    ProjectUpdate:
      type: object
      properties:
        name:
          type: string
        description:
          type: ["string", "null"]
        status:
          type: string
          enum: [planning, active, on_hold, completed, cancelled]
        priority:
          type: string
          enum: [low, medium, high, critical]
        departmentId:
          type: ["integer", "null"]
        startDate:
          type: ["string", "null"]
          format: date
        dueDate:
          type: ["string", "null"]
          format: date
        progress:
          type: integer

    ProjectsSummary:
      type: object
      required: [total, active, completed, overdue, byStatus, byPriority]
      properties:
        total:
          type: integer
        active:
          type: integer
        completed:
          type: integer
        overdue:
          type: integer
        byStatus:
          type: array
          items:
            $ref: "#/components/schemas/CountByLabel"
        byPriority:
          type: array
          items:
            $ref: "#/components/schemas/CountByLabel"

    # ── Tasks ────────────────────────────────────────────────────────────────
    Task:
      type: object
      required: [id, title, status, priority, createdAt]
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: ["string", "null"]
        status:
          type: string
          enum: [backlog, todo, in_progress, in_review, done]
        priority:
          type: string
          enum: [low, medium, high, critical]
        projectId:
          type: ["integer", "null"]
        projectName:
          type: ["string", "null"]
        assigneeId:
          type: ["integer", "null"]
        assigneeName:
          type: ["string", "null"]
        assigneeAvatar:
          type: ["string", "null"]
        dueDate:
          type: ["string", "null"]
          format: date
        estimatedHours:
          type: ["number", "null"]
        loggedHours:
          type: ["number", "null"]
        tags:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time

    TaskInput:
      type: object
      required: [title]
      properties:
        title:
          type: string
        description:
          type: ["string", "null"]
        status:
          type: string
          enum: [backlog, todo, in_progress, in_review, done]
        priority:
          type: string
          enum: [low, medium, high, critical]
        projectId:
          type: ["integer", "null"]
        assigneeId:
          type: ["integer", "null"]
        dueDate:
          type: ["string", "null"]
          format: date
        estimatedHours:
          type: ["number", "null"]
        tags:
          type: array
          items:
            type: string

    TaskUpdate:
      type: object
      properties:
        title:
          type: string
        description:
          type: ["string", "null"]
        status:
          type: string
          enum: [backlog, todo, in_progress, in_review, done]
        priority:
          type: string
          enum: [low, medium, high, critical]
        assigneeId:
          type: ["integer", "null"]
        dueDate:
          type: ["string", "null"]
          format: date
        estimatedHours:
          type: ["number", "null"]
        loggedHours:
          type: ["number", "null"]
        tags:
          type: array
          items:
            type: string

    # ── Documents ─────────────────────────────────────────────────────────────
    Document:
      type: object
      required: [id, name, type, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        type:
          type: string
          enum: [pdf, docx, xlsx, pptx, image, video, zip, other]
        objectPath:
          type: ["string", "null"]
        url:
          type: ["string", "null"]
        size:
          type: ["integer", "null"]
        folderId:
          type: ["integer", "null"]
        departmentId:
          type: ["integer", "null"]
        uploadedById:
          type: ["integer", "null"]
        uploaderName:
          type: ["string", "null"]
        starred:
          type: boolean
        tags:
          type: array
          items:
            type: string
        description:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time

    DocumentInput:
      type: object
      required: [name, type]
      properties:
        name:
          type: string
        type:
          type: string
          enum: [pdf, docx, xlsx, pptx, image, video, zip, other]
        objectPath:
          type: ["string", "null"]
        url:
          type: ["string", "null"]
        size:
          type: ["integer", "null"]
        folderId:
          type: ["integer", "null"]
        departmentId:
          type: ["integer", "null"]
        tags:
          type: array
          items:
            type: string
        description:
          type: ["string", "null"]

    DocumentUpdate:
      type: object
      properties:
        name:
          type: string
        tags:
          type: array
          items:
            type: string
        description:
          type: ["string", "null"]
        folderId:
          type: ["integer", "null"]
        starred:
          type: boolean

    # ── Announcements ─────────────────────────────────────────────────────────
    Announcement:
      type: object
      required: [id, title, content, priority, authorId, createdAt]
      properties:
        id:
          type: integer
        title:
          type: string
        content:
          type: string
        priority:
          type: string
          enum: [low, normal, high, urgent]
        authorId:
          type: integer
        authorName:
          type: string
        authorAvatar:
          type: ["string", "null"]
        pinned:
          type: boolean
        createdAt:
          type: string
          format: date-time

    AnnouncementInput:
      type: object
      required: [title, content]
      properties:
        title:
          type: string
        content:
          type: string
        priority:
          type: string
          enum: [low, normal, high, urgent]
        pinned:
          type: boolean

    # ── Attendance ────────────────────────────────────────────────────────────
    Attendance:
      type: object
      required: [id, userId, date, clockIn, createdAt]
      properties:
        id:
          type: integer
        userId:
          type: integer
        userName:
          type: string
        date:
          type: string
          format: date
        clockIn:
          type: string
          format: date-time
        clockOut:
          type: ["string", "null"]
          format: date-time
        hoursWorked:
          type: ["number", "null"]
        status:
          type: string
          enum: [present, absent, late, half_day, remote]
        createdAt:
          type: string
          format: date-time

    AttendanceSummary:
      type: object
      required: [totalDays, presentDays, absentDays, lateDays, avgHoursPerDay]
      properties:
        totalDays:
          type: integer
        presentDays:
          type: integer
        absentDays:
          type: integer
        lateDays:
          type: integer
        avgHoursPerDay:
          type: number
        byUser:
          type: array
          items:
            $ref: "#/components/schemas/UserAttendanceStat"

    UserAttendanceStat:
      type: object
      required: [userId, userName, presentDays, absentDays, avgHoursPerDay]
      properties:
        userId:
          type: integer
        userName:
          type: string
        presentDays:
          type: integer
        absentDays:
          type: integer
        avgHoursPerDay:
          type: number

    # ── Leaves ─────────────────────────────────────────────────────────────────
    Leave:
      type: object
      required: [id, userId, type, startDate, endDate, status, createdAt]
      properties:
        id:
          type: integer
        userId:
          type: integer
        userName:
          type: string
        userAvatar:
          type: ["string", "null"]
        type:
          type: string
          enum: [annual, sick, personal, maternity, paternity, unpaid, other]
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        days:
          type: integer
        reason:
          type: ["string", "null"]
        status:
          type: string
          enum: [pending, approved, rejected, cancelled]
        reviewedById:
          type: ["integer", "null"]
        reviewerName:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time

    LeaveInput:
      type: object
      required: [type, startDate, endDate]
      properties:
        type:
          type: string
          enum: [annual, sick, personal, maternity, paternity, unpaid, other]
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        reason:
          type: ["string", "null"]

    LeaveStatusUpdate:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [approved, rejected, cancelled]

    # ── Analytics ──────────────────────────────────────────────────────────────
    DashboardAnalytics:
      type: object
      required: [totalEmployees, activeProjects, pendingTasks, presentToday, documentsUploaded, tasksByStatus, recentHires, projectsByStatus]
      properties:
        totalEmployees:
          type: integer
        activeProjects:
          type: integer
        pendingTasks:
          type: integer
        presentToday:
          type: integer
        documentsUploaded:
          type: integer
        pendingLeaves:
          type: integer
        tasksByStatus:
          type: array
          items:
            $ref: "#/components/schemas/CountByLabel"
        projectsByStatus:
          type: array
          items:
            $ref: "#/components/schemas/CountByLabel"
        recentHires:
          type: array
          items:
            $ref: "#/components/schemas/User"
        upcomingDeadlines:
          type: array
          items:
            $ref: "#/components/schemas/Task"

    ActivityItem:
      type: object
      required: [id, type, description, actorName, createdAt]
      properties:
        id:
          type: integer
        type:
          type: string
          enum: [task_created, task_completed, project_created, document_uploaded, leave_requested, announcement_posted, user_joined]
        description:
          type: string
        actorName:
          type: string
        actorAvatar:
          type: ["string", "null"]
        entityId:
          type: ["integer", "null"]
        entityType:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time

    ProductivityAnalytics:
      type: object
      required: [period, taskCompletionRate, avgTasksPerDay, topPerformers, weeklyTrend]
      properties:
        period:
          type: string
        taskCompletionRate:
          type: number
        avgTasksPerDay:
          type: number
        topPerformers:
          type: array
          items:
            $ref: "#/components/schemas/UserProductivityStat"
        weeklyTrend:
          type: array
          items:
            $ref: "#/components/schemas/TrendPoint"

    UserProductivityStat:
      type: object
      required: [userId, userName, completedTasks, avgHoursPerTask]
      properties:
        userId:
          type: integer
        userName:
          type: string
        avatarUrl:
          type: ["string", "null"]
        completedTasks:
          type: integer
        avgHoursPerTask:
          type: number

    TrendPoint:
      type: object
      required: [label, value]
      properties:
        label:
          type: string
        value:
          type: number

    CountByLabel:
      type: object
      required: [label, count]
      properties:
        label:
          type: string
        count:
          type: integer

    # ── Storage ────────────────────────────────────────────────────────────────
    UploadUrlRequest:
      type: object
      required: [name, size, contentType]
      properties:
        name:
          type: string
          minLength: 1
        size:
          type: integer
          minimum: 1
        contentType:
          type: string
          minLength: 1

    UploadUrlResponse:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL:
          type: string
          format: uri
        objectPath:
          type: string
        metadata:
          $ref: "#/components/schemas/UploadUrlRequest"

    # ── Meetings ───────────────────────────────────────────────────────────
    Meeting:
      type: object
      required: [id, title, roomId, hostId, scheduledAt, durationMinutes, status, kind, participantIds, createdAt]
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: ["string", "null"]
        roomId:
          type: string
        hostId:
          type: integer
        hostName:
          type: ["string", "null"]
        hostAvatar:
          type: ["string", "null"]
        scheduledAt:
          type: string
          format: date-time
        durationMinutes:
          type: integer
        status:
          type: string
          enum: [scheduled, live, ended, cancelled]
        kind:
          type: string
          enum: [one_on_one, group]
        participantIds:
          type: array
          items: { type: integer }
        joinUrl:
          type: string
        createdAt:
          type: string
          format: date-time

    MeetingInput:
      type: object
      required: [title, scheduledAt]
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: ["string", "null"]
        scheduledAt:
          type: string
          format: date-time
        durationMinutes:
          type: integer
          minimum: 5
          maximum: 480
          default: 30
        kind:
          type: string
          enum: [one_on_one, group]
          default: group
        participantIds:
          type: array
          items: { type: integer }
          default: []
        notifyEveryone:
          type: boolean
          default: false

    # ── Notifications ─────────────────────────────────────────────────────
    Notification:
      type: object
      required: [id, userId, type, title, read, createdAt]
      properties:
        id:
          type: integer
        userId:
          type: integer
        type:
          type: string
        title:
          type: string
        body:
          type: ["string", "null"]
        link:
          type: ["string", "null"]
        read:
          type: boolean
        createdAt:
          type: string
          format: date-time

    NotificationList:
      type: object
      required: [items, unreadCount]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Notification"
        unreadCount:
          type: integer

    # ── Chat ───────────────────────────────────────────────────────────────
    ConversationMember:
      type: object
      required: [id, firstName, lastName]
      properties:
        id: { type: integer }
        firstName: { type: string }
        lastName: { type: string }
        avatarUrl: { type: ["string", "null"] }
        jobTitle: { type: ["string", "null"] }

    Conversation:
      type: object
      required: [id, kind, members, unreadCount, createdAt]
      properties:
        id: { type: integer }
        kind:
          type: string
          enum: [direct, group]
        name: { type: ["string", "null"] }
        members:
          type: array
          items:
            $ref: "#/components/schemas/ConversationMember"
        lastMessage:
          oneOf:
            - $ref: "#/components/schemas/ChatMessage"
            - type: "null"
        unreadCount: { type: integer }
        createdAt:
          type: string
          format: date-time

    ChatMessage:
      type: object
      required: [id, conversationId, senderId, body, createdAt]
      properties:
        id: { type: integer }
        conversationId: { type: integer }
        senderId: { type: integer }
        senderName: { type: ["string", "null"] }
        body: { type: string }
        createdAt:
          type: string
          format: date-time

    ChatMessageInput:
      type: object
      required: [body]
      properties:
        body: { type: string, minLength: 1, maxLength: 4000 }

    DirectConversationInput:
      type: object
      required: [userId]
      properties:
        userId: { type: integer }

    GroupConversationInput:
      type: object
      required: [name, memberIds]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        memberIds:
          type: array
          items: { type: integer }
          minItems: 1

    # ── Reimbursements ─────────────────────────────────────────────────────
    Reimbursement:
      type: object
      required: [id, userId, category, amount, currency, expenseDate, status, createdAt]
      properties:
        id: { type: integer }
        userId: { type: integer }
        userName: { type: string }
        userAvatar: { type: ["string", "null"] }
        category:
          type: string
          enum: [travel, meals, accommodation, supplies, software, training, client, other]
        amount: { type: number }
        currency: { type: string }
        expenseDate: { type: string, format: date }
        description: { type: ["string", "null"] }
        receiptUrl: { type: ["string", "null"] }
        status:
          type: string
          enum: [pending, approved, rejected, paid, cancelled]
        reviewedById: { type: ["integer", "null"] }
        reviewerName: { type: ["string", "null"] }
        reviewedAt: { type: ["string", "null"], format: date-time }
        reviewNotes: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }

    ReimbursementInput:
      type: object
      required: [category, amount, expenseDate]
      properties:
        category:
          type: string
          enum: [travel, meals, accommodation, supplies, software, training, client, other]
        amount: { type: number, minimum: 0.01 }
        currency: { type: string, default: "INR" }
        expenseDate: { type: string, format: date }
        description: { type: ["string", "null"] }
        receiptUrl: { type: ["string", "null"] }

    ReimbursementStatusUpdate:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [approved, rejected, paid, cancelled]
        reviewNotes: { type: ["string", "null"] }

    # ── Performance ────────────────────────────────────────────────────────
    Goal:
      type: object
      required: [id, userId, title, category, weight, status, createdAt]
      properties:
        id: { type: integer }
        userId: { type: integer }
        userName: { type: string }
        userAvatar: { type: ["string", "null"] }
        title: { type: string }
        description: { type: ["string", "null"] }
        category: { type: string }
        weight: { type: integer }
        targetValue: { type: ["number", "null"] }
        currentValue: { type: ["number", "null"] }
        unit: { type: ["string", "null"] }
        dueDate: { type: ["string", "null"], format: date }
        status:
          type: string
          enum: [not_started, in_progress, completed, missed, cancelled]
        progressPercent: { type: number }
        createdById: { type: integer }
        createdAt: { type: string, format: date-time }

    GoalInput:
      type: object
      required: [title]
      properties:
        userId: { type: ["integer", "null"] }
        title: { type: string, minLength: 1 }
        description: { type: ["string", "null"] }
        category: { type: string, default: "personal" }
        weight: { type: integer, minimum: 1, maximum: 10, default: 1 }
        targetValue: { type: ["number", "null"] }
        currentValue: { type: ["number", "null"] }
        unit: { type: ["string", "null"] }
        dueDate: { type: ["string", "null"], format: date }

    GoalUpdate:
      type: object
      properties:
        title: { type: ["string", "null"] }
        description: { type: ["string", "null"] }
        category: { type: ["string", "null"] }
        weight: { type: ["integer", "null"] }
        targetValue: { type: ["number", "null"] }
        currentValue: { type: ["number", "null"] }
        unit: { type: ["string", "null"] }
        dueDate: { type: ["string", "null"], format: date }
        status:
          type: ["string", "null"]
          enum: [not_started, in_progress, completed, missed, cancelled, null]

    Kpi:
      type: object
      required: [id, userId, name, target, current, period, periodStart, periodEnd, createdAt]
      properties:
        id: { type: integer }
        userId: { type: integer }
        userName: { type: string }
        userAvatar: { type: ["string", "null"] }
        name: { type: string }
        target: { type: number }
        current: { type: number }
        unit: { type: ["string", "null"] }
        period: { type: string, enum: [monthly, quarterly, yearly] }
        periodStart: { type: string, format: date }
        periodEnd: { type: string, format: date }
        attainmentPercent: { type: number }
        createdAt: { type: string, format: date-time }

    KpiInput:
      type: object
      required: [name, target, periodStart, periodEnd]
      properties:
        userId: { type: ["integer", "null"] }
        name: { type: string, minLength: 1 }
        target: { type: number }
        current: { type: number, default: 0 }
        unit: { type: ["string", "null"] }
        period: { type: string, enum: [monthly, quarterly, yearly], default: quarterly }
        periodStart: { type: string, format: date }
        periodEnd: { type: string, format: date }

    KpiUpdate:
      type: object
      properties:
        name: { type: ["string", "null"] }
        target: { type: ["number", "null"] }
        current: { type: ["number", "null"] }
        unit: { type: ["string", "null"] }
        period:
          type: ["string", "null"]
          enum: [monthly, quarterly, yearly, null]
        periodStart: { type: ["string", "null"], format: date }
        periodEnd: { type: ["string", "null"], format: date }

    PerfReview:
      type: object
      required: [id, revieweeId, reviewerId, cycle, type, status, createdAt]
      properties:
        id: { type: integer }
        revieweeId: { type: integer }
        revieweeName: { type: string }
        reviewerId: { type: integer }
        reviewerName: { type: string }
        cycle: { type: string }
        type:
          type: string
          enum: [self, manager, peer, upward]
        anonymous: { type: boolean }
        ratings:
          type: object
          additionalProperties: { type: number }
        overallRating: { type: ["number", "null"] }
        strengths: { type: ["string", "null"] }
        improvements: { type: ["string", "null"] }
        comments: { type: ["string", "null"] }
        status:
          type: string
          enum: [draft, submitted]
        submittedAt: { type: ["string", "null"], format: date-time }
        createdAt: { type: string, format: date-time }

    PerfReviewInput:
      type: object
      required: [revieweeId, cycle, type]
      properties:
        revieweeId: { type: integer }
        cycle: { type: string, minLength: 1 }
        type:
          type: string
          enum: [self, manager, peer, upward]
        anonymous: { type: boolean, default: false }
        ratings:
          type: object
          additionalProperties: { type: number }
        overallRating: { type: ["number", "null"], minimum: 1, maximum: 5 }
        strengths: { type: ["string", "null"] }
        improvements: { type: ["string", "null"] }
        comments: { type: ["string", "null"] }
        submit: { type: boolean, default: true }

    Appraisal:
      type: object
      required: [id, userId, cycle, finalRating, currency, status, createdAt]
      properties:
        id: { type: integer }
        userId: { type: integer }
        userName: { type: string }
        userAvatar: { type: ["string", "null"] }
        cycle: { type: string }
        finalRating: { type: number }
        salaryChangePercent: { type: ["number", "null"] }
        bonusAmount: { type: ["number", "null"] }
        currency: { type: string }
        notes: { type: ["string", "null"] }
        status:
          type: string
          enum: [pending, approved, rejected]
        createdById: { type: integer }
        decidedById: { type: ["integer", "null"] }
        decidedAt: { type: ["string", "null"], format: date-time }
        createdAt: { type: string, format: date-time }

    AppraisalInput:
      type: object
      required: [userId, cycle, finalRating]
      properties:
        userId: { type: integer }
        cycle: { type: string, minLength: 1 }
        finalRating: { type: number, minimum: 1, maximum: 5 }
        salaryChangePercent: { type: ["number", "null"] }
        bonusAmount: { type: ["number", "null"] }
        currency: { type: string, default: "INR" }
        notes: { type: ["string", "null"] }

    AppraisalStatusUpdate:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [approved, rejected]

    Promotion:
      type: object
      required: [id, userId, fromTitle, toTitle, effectiveDate, status, createdAt]
      properties:
        id: { type: integer }
        userId: { type: integer }
        userName: { type: string }
        userAvatar: { type: ["string", "null"] }
        fromTitle: { type: string }
        toTitle: { type: string }
        fromLevel: { type: ["string", "null"] }
        toLevel: { type: ["string", "null"] }
        effectiveDate: { type: string, format: date }
        reason: { type: ["string", "null"] }
        status:
          type: string
          enum: [proposed, approved, rejected, effective]
        requestedById: { type: integer }
        requestedByName: { type: ["string", "null"] }
        decidedById: { type: ["integer", "null"] }
        decidedAt: { type: ["string", "null"], format: date-time }
        createdAt: { type: string, format: date-time }

    PromotionInput:
      type: object
      required: [userId, fromTitle, toTitle, effectiveDate]
      properties:
        userId: { type: integer }
        fromTitle: { type: string, minLength: 1 }
        toTitle: { type: string, minLength: 1 }
        fromLevel: { type: ["string", "null"] }
        toLevel: { type: ["string", "null"] }
        effectiveDate: { type: string, format: date }
        reason: { type: ["string", "null"] }

    PromotionStatusUpdate:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [approved, rejected, effective]

    PerformanceAnalytics:
      type: object
      required: [totalGoals, completedGoals, goalCompletionRate, avgKpiAttainment, avgOverallRating, reviewsSubmitted, pendingAppraisals, pendingPromotions, topPerformers, ratingDistribution]
      properties:
        totalGoals: { type: integer }
        completedGoals: { type: integer }
        goalCompletionRate: { type: number }
        avgKpiAttainment: { type: number }
        avgOverallRating: { type: number }
        reviewsSubmitted: { type: integer }
        pendingAppraisals: { type: integer }
        pendingPromotions: { type: integer }
        topPerformers:
          type: array
          items:
            type: object
            required: [userId, userName, avgRating, goalsCompleted]
            properties:
              userId: { type: integer }
              userName: { type: string }
              userAvatar: { type: ["string", "null"] }
              avgRating: { type: number }
              goalsCompleted: { type: integer }
        ratingDistribution:
          type: array
          items:
            type: object
            required: [bucket, count]
            properties:
              bucket: { type: string }
              count: { type: integer }
